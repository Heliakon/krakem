<script>
// A cropped, nautilus-like spiral of soft particles, echoing the site's first animated shape.
const ctx=document.getElementById('dots').getContext('2d');
const cx=1010,cy=250;
for(let i=0;i<620;i++){
 const t=i/620,angle=i*0.32,radius=18+Math.pow(t,1.35)*360,wobble=Math.sin(i*1.7)*10*t;
 const x=cx+Math.cos(angle)*(radius+wobble),y=cy+Math.sin(angle)*(radius+wobble)*.82;
 const r=1.1+2.6*(1-t)*Math.abs(Math.sin(i*0.9))+.6;
 const g=ctx.createRadialGradient(x,y,0,x,y,r*4);
 g.addColorStop(0,`rgba(215,240,177,${.55-.35*t})`);g.addColorStop(.25,`rgba(130,195,65,${.32-.2*t})`);g.addColorStop(1,'rgba(102,162,40,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*4,0,Math.PI*2);ctx.fill();
}
</script>
