name: Attach offline download to release

# When a release is published, builds and checks the tagged source, then attaches
# krakem.html (the whole site in one file) and its SHA-256 checksum.
# It can also be run by hand from the Actions tab for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the download to, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the site and krakem.html
        run: |
          node scripts/build.mjs
          node scripts/build-offline.mjs
      - name: Check the site and krakem.html
        run: |
          node scripts/check.mjs
          python3 scripts/check-html.py
      - name: Upload krakem.html and its checksum
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum krakem.html > krakem.html.sha256
          cat krakem.html.sha256
          gh release upload "$TAG" krakem.html krakem.html.sha256 --clobber --repo "$GITHUB_REPOSITORY"
